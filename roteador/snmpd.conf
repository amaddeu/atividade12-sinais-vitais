# Agente SNMP do roteador de borda
# Escuta só UDP/161. NÃO existe "rocommunity": SNMPv1/v2c ficam desativados.
# O usuário SNMPv3 (createUser + rouser ... priv) é acrescentado pelo entrypoint a partir do .env.
agentAddress udp:161

sysLocation    Datacenter Banco - Borda Internet
sysContact     NOC <noc@banco.lab>
sysDescr       Roteador de borda AS65010 (FRRouting/BGP)

# Expõe a contagem de rotas BGP recebidas (NET-SNMP-EXTEND-MIB)
extend bgp_rotas /usr/local/bin/bgp-rotas
