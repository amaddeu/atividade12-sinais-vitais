frr defaults traditional
hostname roteador-borda
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
! Rede interna do banco que anunciamos para a Internet
ip route 10.50.0.0/16 Null0
!
router bgp 65010
 bgp router-id 172.30.20.254
 no bgp ebgp-requires-policy
 neighbor 172.30.20.253 remote-as 65020
 neighbor 172.30.20.253 description ISP-Transito
 !
 address-family ipv4 unicast
  network 10.50.0.0/16
 exit-address-family
!
line vty
!
